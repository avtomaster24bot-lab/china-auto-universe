name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей (только playwright-core для смоук-теста)
        run: npm ci

      - name: Проверка данных и юнит-тесты (VIN, OBD-парсер)
        run: npm test

      - name: Сборка dist/
        run: npm run build

      - name: Смоук-тест в headless Chrome + скриншоты
        run: |
          python3 -m http.server 8080 --directory dist >/tmp/server.log 2>&1 &
          sleep 2
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" node tools/screenshots.mjs

      - name: Артефакт сайта
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/

      - name: Артефакт скриншотов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png

      - name: Артефакт для GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # Демо-деплой на GitHub Pages. Для коммерческого запуска перейти на Cloudflare Pages
  # (GitHub Pages не предназначен для коммерческих сайтов).
  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Деплой — раскомментируйте и выберите хостинг. GitHub Pages не подходит для
  # коммерческого сайта (ограничения Terms of Service), поэтому пример — Cloudflare Pages.
